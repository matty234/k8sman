replicaCount: 1

image:
  repository: nginx
  tag: 1.27-alpine
  pullPolicy: IfNotPresent

message: Hello from k8sman-demo

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Run a short post-install/post-upgrade smoke-test Job.
smokeTest:
  enabled: true

cache:
  enabled: false
