apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cache
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cache, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cache, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: redis
          image: {{ .Values.image }}
          args: ["--maxmemory", "{{ .Values.maxMemory }}"]
          ports: [{name: redis, containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cache
spec:
  selector: {app.kubernetes.io/name: cache, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: redis, port: 6379, targetPort: redis}]
