# Sample resources for the k8sman-dev kind cluster. Apply with `make samples`.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels: {team: platform}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: demo}
data:
  APP_MODE: production
  nginx.conf: |
    server { listen 8080; location / { return 200 'ok'; } }
---
apiVersion: v1
kind: Secret
metadata: {name: web-secret, namespace: demo}
type: Opaque
stringData:
  API_TOKEN: s3cr3t-token
  DB_PASSWORD: hunter2
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: web, namespace: demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: demo}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: web-pod-reader, namespace: demo}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
subjects:
  - {kind: ServiceAccount, name: web, namespace: demo}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels: {app: web, tier: frontend}
  annotations: {k8sman.dev/owner: platform-team}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  template:
    metadata: {labels: {app: web, tier: frontend}}
    spec:
      serviceAccountName: web
      initContainers:
        - name: init-wait
          image: busybox:1.36
          command: [sh, -c, "echo initialising; sleep 2"]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - {name: APP_MODE, valueFrom: {configMapKeyRef: {name: web-config, key: APP_MODE}}}
            - {name: API_TOKEN, valueFrom: {secretKeyRef: {name: web-secret, key: API_TOKEN}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: LOG_LEVEL, value: info}
          envFrom:
            - configMapRef: {name: web-config}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: cache, mountPath: /var/cache/nginx}
        - name: log-sidecar
          image: busybox:1.36
          command: [sh, -c]
          args: ["i=0; while true; do echo \"$(date -Iseconds) heartbeat $i\"; i=$((i+1)); sleep 3; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
      volumes:
        - name: conf
          configMap:
            name: web-config
            items: [{key: nginx.conf, path: default.conf}]
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo, labels: {app: web}}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata: {name: web-nodeport, namespace: demo}
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: 8080, nodePort: 30080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: demo}
spec:
  rules:
    - host: web.demo.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: web, port: {number: 80}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: web, port: {name: http}}}}
  tls:
    - hosts: [web.demo.local]
      secretName: web-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-allow-frontend, namespace: demo}
spec:
  podSelector: {matchLabels: {app: web}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {tier: frontend}}
        - namespaceSelector: {matchLabels: {team: platform}}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web, namespace: demo}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: demo}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: demo}
spec:
  clusterIP: None
  selector: {app: redis}
  ports: [{name: redis, port: 6379}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-agent, namespace: demo}
spec:
  selector: {matchLabels: {app: node-agent}}
  template:
    metadata: {labels: {app: node-agent}}
    spec:
      tolerations: [{operator: Exists}]
      containers:
        - name: agent
          image: busybox:1.36
          command: [sh, -c, "while true; do echo scanning $(hostname); sleep 10; done"]
---
apiVersion: batch/v1
kind: Job
metadata: {name: migrate-db, namespace: demo}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: [sh, -c, "echo running migrations; sleep 3; echo done"]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report, namespace: demo}
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: [sh, -c, "echo generating report"]
---
# Deliberately broken: exercises CrashLoopBackOff / previous-logs UI.
apiVersion: v1
kind: Pod
metadata: {name: crashy, namespace: demo, labels: {app: crashy}}
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "echo starting; echo 'fatal: config missing' >&2; exit 3"]
---
# Deliberately broken: ImagePullBackOff.
apiVersion: v1
kind: Pod
metadata: {name: bad-image, namespace: demo}
spec:
  containers:
    - {name: app, image: "registry.invalid/nope:latest"}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: widgets.example.k8sman.dev}
spec:
  group: example.k8sman.dev
  scope: Namespaced
  names: {plural: widgets, singular: widget, kind: Widget, shortNames: [wdg], categories: [all]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Color, type: string, jsonPath: .spec.color}
        - {name: Size, type: integer, jsonPath: .spec.size}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                color: {type: string, enum: [red, green, blue]}
                size: {type: integer, minimum: 1}
                tags: {type: array, items: {type: string}}
                owner:
                  type: object
                  properties:
                    team: {type: string}
                    email: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
