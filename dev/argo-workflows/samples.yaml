# Sample Argo Workflows objects used to exercise k8sman's Argo Workflows
# panels. Install Argo Workflows into the dev kind cluster first:
#
#   kubectl create ns argo
#   kubectl apply --server-side -n argo -f \
#     https://github.com/argoproj/argo-workflows/releases/download/v4.0.1/install.yaml
#   kubectl apply -f dev/argo-workflows/samples.yaml
#   kubectl create -f dev/argo-workflows/runs.yaml   # a passing and a failing run
#
# Everything runs in the argo-demo namespace with tiny busybox steps.
apiVersion: v1
kind: Namespace
metadata:
  name: argo-demo
---
# The executor reports outputs through WorkflowTaskResults.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: argo-demo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor-default
  namespace: argo-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor
subjects:
  - kind: ServiceAccount
    name: default
    namespace: argo-demo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: build-and-test
  namespace: argo-demo
spec:
  entrypoint: pipeline
  arguments:
    parameters:
      - name: target
        value: staging
        enum: [staging, production]
        description: Where to deploy
      - name: fail-tests
        value: "false"
        enum: ["true", "false"]
      - name: message
        value: hello
  templates:
    - name: pipeline
      dag:
        tasks:
          - name: checkout
            template: echo
            arguments: {parameters: [{name: msg, value: "checkout"}]}
          - name: lint
            depends: checkout
            template: echo
            arguments: {parameters: [{name: msg, value: "lint"}]}
          - name: build
            depends: checkout
            template: build
          - name: unit-tests
            depends: build
            template: tests
            arguments: {parameters: [{name: fail, value: "{{workflow.parameters.fail-tests}}"}]}
          - name: package
            depends: build && lint
            template: echo
            arguments: {parameters: [{name: msg, value: "package"}]}
          - name: deploy
            depends: unit-tests && package
            template: deploy
          - name: notify
            depends: deploy.Failed || deploy.Succeeded
            template: echo
            arguments: {parameters: [{name: msg, value: "notify"}]}
    - name: echo
      inputs:
        parameters:
          - name: msg
      container:
        image: busybox:1.36
        command: [sh, -c]
        args: ["echo {{inputs.parameters.msg}}; sleep 2"]
    - name: build
      outputs:
        parameters:
          - name: image
            valueFrom:
              path: /tmp/image
      container:
        image: busybox:1.36
        command: [sh, -c]
        args: ["echo building; echo registry.example/app:1.2.3 > /tmp/image; sleep 3"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
    - name: tests
      inputs:
        parameters:
          - name: fail
      retryStrategy:
        limit: "2"
      script:
        image: busybox:1.36
        command: [sh]
        source: |
          echo running tests
          sleep 1
          if [ "{{inputs.parameters.fail}}" = "true" ]; then echo "3 tests failed" >&2; exit 3; fi
          echo all good
    - name: deploy
      steps:
        - - name: render
            template: echo
            arguments: {parameters: [{name: msg, value: "render {{workflow.parameters.target}}"}]}
        - - name: apply-a
            template: echo
            arguments: {parameters: [{name: msg, value: "apply a"}]}
          - name: apply-b
            template: echo
            arguments: {parameters: [{name: msg, value: "apply b"}]}
        - - name: verify
            template: echo
            arguments: {parameters: [{name: msg, value: "verify"}]}
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: hello-cluster
spec:
  entrypoint: hello
  arguments:
    parameters:
      - name: who
        value: world
  templates:
    - name: hello
      inputs:
        parameters:
          - name: who
            value: "{{workflow.parameters.who}}"
      container:
        image: busybox:1.36
        command: [echo]
        args: ["hello {{inputs.parameters.who}}"]
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: nightly-report
  namespace: argo-demo
spec:
  schedules:
    - "*/15 * * * *"
    - "30 2 * * 1-5"
  timezone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  workflowSpec:
    entrypoint: report
    templates:
      - name: report
        container:
          image: busybox:1.36
          command: [sh, -c]
          args: ["echo generating report; sleep 3"]
