# A driver's slice for node-a (v1): two GPUs, one tainted.
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: node-a-gpu.example.com-x2k9d
  creationTimestamp: "2025-12-01T00:00:00Z"
spec:
  nodeName: node-a
  driver: gpu.example.com
  pool:
    name: node-a
    generation: 3
    resourceSliceCount: 1
  devices:
    - name: gpu-0
      attributes:
        gpu.example.com/model:
          string: a100
        gpu.example.com/index:
          int: 0
        driverVersion:
          version: 1.2.0
      capacity:
        gpu.example.com/memory:
          value: 40Gi
    - name: gpu-1
      attributes:
        gpu.example.com/model:
          string: a100
        gpu.example.com/index:
          int: 1
      capacity:
        gpu.example.com/memory:
          value: 40Gi
      taints:
        - key: example.com/unhealthy
          value: ecc
          effect: NoSchedule
---
# A claim with gpu-0 from this pool, and one from another node's pool.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: web-0-gpu-x7k2p
  namespace: demo
spec:
  devices:
    requests:
      - name: gpu
        exactly: {deviceClassName: gpu.example.com}
status:
  allocation:
    devices:
      results:
        - {request: gpu, driver: gpu.example.com, pool: node-a, device: gpu-0}
  reservedFor:
    - {resource: pods, name: web-0, uid: 2b6f0c1e-0000-4000-8000-0000000000aa}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: web-1-gpu-q2w3e
  namespace: demo
spec:
  devices:
    requests:
      - name: gpu
        exactly: {deviceClassName: gpu.example.com}
status:
  allocation:
    devices:
      results:
        - {request: gpu, driver: gpu.example.com, pool: node-b, device: gpu-1}
