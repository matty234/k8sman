# A claim (resource.k8s.io/v1) that pod web-0's template made: allocated on
# node-a, reserved by the pod, with a device's status. The pod follows (the
# claim's Template comes from its spec).
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: web-0-gpu-x7k2p
  namespace: demo
  uid: 2b6f0c1e-0000-4000-8000-000000000001
  creationTimestamp: "2025-12-31T23:00:00Z"
  annotations:
    resource.kubernetes.io/pod-claim-name: gpu
  ownerReferences:
    - apiVersion: v1
      kind: Pod
      name: web-0
      uid: 2b6f0c1e-0000-4000-8000-0000000000aa
      controller: true
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: ExactCount
          count: 2
          selectors:
            - cel:
                expression: device.attributes["gpu.example.com"].model == "a100"
      - name: nic
        exactly:
          deviceClassName: nic.example.com
          adminAccess: true
          tolerations:
            - key: example.com/maintenance
              operator: Exists
status:
  allocation:
    allocationTimestamp: "2025-12-31T23:00:05Z"
    devices:
      results:
        - request: gpu
          driver: gpu.example.com
          pool: node-a
          device: gpu-0
        - request: gpu
          driver: gpu.example.com
          pool: node-a
          device: gpu-1
        - request: nic
          driver: nic.example.com
          pool: node-a
          device: nic-0
          adminAccess: true
    nodeSelector:
      nodeSelectorTerms:
        - matchFields:
            - key: metadata.name
              operator: In
              values: [node-a]
  reservedFor:
    - resource: pods
      name: web-0
      uid: 2b6f0c1e-0000-4000-8000-0000000000aa
  devices:
    - driver: nic.example.com
      pool: node-a
      device: nic-0
      networkData:
        ips: [10.0.0.5/24]
        hardwareAddress: "02:00:00:00:00:01"
      conditions:
        - type: Ready
          status: "True"
          reason: Configured
---
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  namespace: demo
  uid: 2b6f0c1e-0000-4000-8000-0000000000aa
spec:
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: gpu-pair
  containers:
    - name: web
      image: example.com/web:1.0
