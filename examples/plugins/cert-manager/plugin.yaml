# yaml-language-server: $schema=https://raw.githubusercontent.com/matty234/k8sman/main/schema/plugin.v1.json
#
# A small teaching plugin for cert-manager: two columns, one panel section,
# one alert, one shell action, a sidebar section and an icon. The full
# plugin (related objects, metrics, patch actions with forms, Issuers, ...)
# is in the plugin directory: k8sman-plugins, plugins/cert-manager.
# Format reference: docs/PLUGINS.md ("Writing a plugin").
#
# This folder keeps the id `cert-manager`: uninstall the full plugin
# before loading it in developer mode (Settings > Integrations > Plugins >
# Load plugin folder..., or --plugin-dev examples/plugins/cert-manager).
# Edit and save: tables and panels update in place.
# Without a cluster: k8sman-server plugin test examples/plugins/cert-manager
apiVersion: k8sman.dev/v1
id: cert-manager
name: cert-manager (example)
version: 1.0.0
description: A short example with Ready and Expires columns, a certificate panel, an expiry alert and cmctl status.
authors: [k8sman]
homepage: https://cert-manager.io

# What the plugin may read and run. Nothing else is reachable. (A link to a
# Secret needs no read permission; reading one, as the full plugin does
# with `related`, does, and sees names and keys only.)
permissions:
  read:
    - cert-manager.io/Certificate
  commands: [cmctl]           # required for shell actions

# A sidebar section for the plugin's kinds (instead of Custom Resources).
nav:
  title: cert-manager
  kinds: [cert-manager.io/Certificate]

kinds:
  cert-manager.io/Certificate:
    icon: verified            # a name from the icon list (docs/PLUGINS.md)

    # Named CEL expressions, shared by columns, panels and alerts.
    variables:
      notAfter: object.?status.?notAfter      # optional: absent until issued

    columns:
      - name: Ready           # replaces the CRD's printer column of the same name
        type: status
        value: 'conditionTrue(object, "Ready") ? "Ready" : condition(object, "Ready").?reason.orValue("Pending")'
      - name: Expires
        type: until           # time left; the UI counts down
        value: variables.notAfter

    panel:
      sections:               # added to the generic panel (Conditions and so on)
        - title: Certificate
          icon: verified
          blocks:
            - type: badges
              items:
                - text: 'conditionTrue(object, "Ready") ? "Ready" : "Not ready"'
            - type: fields
              items:
                - label: Secret
                  value: object.spec.secretName
                  link: ref("", "Secret", object.spec.secretName)   # opens the Secret
                - label: Expires
                  type: until
                  value: variables.notAfter

    # Every run asks first and shows the command; hidden on read-only contexts.
    actions:
      - id: status
        label: cmctl status
        icon: terminal
        shell:
          command: cmctl
          args: [status, certificate, --context, $CONTEXT, -n, $NAMESPACE, $NAME]

    # Evaluated per Certificate on each overview poll: shown on the Overview
    # and in the dock's Issues tab.
    alerts:
      - id: expiring
        label: Certificates expiring within 14 days
        severity: warning
        when: >-
          variables.notAfter.hasValue() &&
          until(variables.notAfter.value()) < duration("336h")
        message: '"Expires in " + humanDuration(until(variables.notAfter.value()))'

    # Starting points in the resource editor's New Resource screen (create
    # mode), under the plugin's name. ${namespace} becomes the editor's
    # namespace; ${name} and ${name:default} are placeholders the user fills
    # (Tab goes to the next one). The first document must be this kind.
    templates:
      - name: Certificate
        description: A TLS certificate for one DNS name, from a ClusterIssuer
        yaml: |
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: ${name:example-tls}
            namespace: ${namespace}
          spec:
            secretName: ${secretName:example-tls}
            dnsNames:
              - ${dnsName:app.example.com}
            issuerRef:
              kind: ClusterIssuer
              name: ${issuer:letsencrypt}
