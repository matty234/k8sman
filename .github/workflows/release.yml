# Builds and publishes a release when a v* tag is pushed (docs/UPDATES.md).
#
#   1. Bump `version:` in frontend/pubspec.yaml, commit.
#   2. git tag -a v0.1.1 -m "release notes (Markdown)" && git push origin v0.1.1
#
# Assets: k8sman-<version>-macos.zip (universal, Developer ID signed and notarized), appcast.xml
# (Sparkle feed, EdDSA-signed), the Windows x64 build from windows.yml
# (k8sman-<version>-windows-x64.zip and -setup.exe, unsigned), the Linux
# x64 build from linux.yml (k8sman-<version>-linux-x64.tar.gz and
# k8sman_<version>_amd64.deb) and SHA256SUMS. The app's feed URL is releases/latest/download/appcast.xml, so
# publishing a (non-pre-)release is what rolls an update out (Windows builds
# and Linux builds only check releases/latest and link to the download). Tags with a pre-release suffix (v0.2.0-rc.1)
# become GitHub pre-releases, which "latest" skips.
#
# Repository settings (Settings → Secrets and variables → Actions):
#   secret   SPARKLE_PRIVATE_ED_KEY  output of `generate_keys -x <file>` (the file's contents)
#   variable SPARKLE_PUBLIC_ED_KEY   output of `generate_keys -p` (optional once committed
#                                    to frontend/macos/Runner/Configs/AppInfo.xcconfig)
#   secret   MACOS_CERT_P12          Developer ID Application certificate + key, .p12, base64
#   secret   MACOS_CERT_PASSWORD     its password
#   secret   NOTARY_KEY_P8           App Store Connect API key (.p8 contents) for notarytool
#   secret   NOTARY_KEY_ID           its Key ID
#   secret   NOTARY_ISSUER_ID        its Issuer ID
#   variable APPLE_TEAM_ID           the Developer ID team (TL74XU6K79)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  linux:
    uses: ./.github/workflows/linux.yml

  release:
    # Publishes only once the Windows and Linux builds have succeeded too.
    needs: [windows, linux]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag matches pubspec.yaml
        id: version
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' frontend/pubspec.yaml)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test
        run: make test

      - name: Import the Developer ID certificate
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            if [ "$PRERELEASE" != true ]; then
              echo "::error::secret MACOS_CERT_P12 is not set; final releases must be Developer ID signed (docs/UPDATES.md)"
              exit 1
            fi
            echo "::warning::no MACOS_CERT_P12: this pre-release is ad-hoc signed"
            exit 0
          fi
          tools/ci-import-cert.sh

      - name: Build the app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary_key }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          flags=()
          if [ -n "$IDENTITY" ]; then
            flags+=(MACOS_SIGN_IDENTITY="$IDENTITY" MACOS_KEYCHAIN="$KEYCHAIN" NOTARIZE=1)
            export NOTARY_KEY_FILE="$NOTARY_KEY"
          fi
          make release REQUIRE_UPDATE_KEY=1 SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" "${flags[@]}"

      - name: Clean up the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "${{ steps.signing.outputs.notary_key }}"

      - name: Release notes
        run: |
          # The annotated tag's message, if any.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > dist/notes.md
          cat dist/notes.md

      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_ED_KEY" ]; then
            echo "::error::secret SPARKLE_PRIVATE_ED_KEY is not set (docs/UPDATES.md)"
            exit 1
          fi
          make appcast RELEASE_NOTES=dist/notes.md GITHUB_REPO="$GITHUB_REPOSITORY"
          # Sanity check: the signed feed verifies.
          build/sparkle/bin/sign_update --verify --ed-key-file - dist/appcast.xml <<< "$SPARKLE_PRIVATE_ED_KEY"
          cat dist/appcast.xml dist/SHA256SUMS

      - name: Add the Windows build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: dist

      - name: Add the Linux build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.artifact }}
          path: dist

      - name: Checksums for the Windows and Linux builds
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "k8sman-$VERSION-windows-x64.zip" "k8sman-$VERSION-windows-x64-setup.exe" \
            "k8sman-$VERSION-linux-x64.tar.gz" k8sman_*_amd64.deb >> SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if [ -s dist/notes.md ]; then flags+=(--notes-file dist/notes.md); else flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "k8sman $VERSION" "${flags[@]}" \
            "dist/k8sman-$VERSION-macos.zip" dist/appcast.xml \
            "dist/k8sman-$VERSION-windows-x64.zip" "dist/k8sman-$VERSION-windows-x64-setup.exe" \
            "dist/k8sman-$VERSION-linux-x64.tar.gz" dist/k8sman_*_amd64.deb \
            dist/SHA256SUMS

      - name: Update the Homebrew tap
        # Bumps Casks/k8sman.rb in matty234/homebrew-tap for final releases.
        # Needs a fine-grained PAT with Contents: read/write on that repo,
        # stored as the secret HOMEBREW_TAP_TOKEN. Skipped when it's absent.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA=$(shasum -a 256 "dist/k8sman-$VERSION-macos.zip" | cut -d' ' -f1)
          echo "version $VERSION  sha256 $SHA"
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set: update matty234/homebrew-tap by hand (version $VERSION, sha256 $SHA)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/matty234/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/k8sman.rb
          # Notarized now: drop the old "Open Anyway" caveat (and the blank line before it).
          perl -0pi -e 's/\n\n  caveats <<~EOS\n.*?\n  EOS\n/\n/s' Casks/k8sman.rb
          if git diff --quiet; then echo "Tap already up to date."; exit 0; fi
          git config user.name "k8sman release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "k8sman $VERSION"
          git push origin HEAD:main
          echo "Updated matty234/homebrew-tap to $VERSION." >> "$GITHUB_STEP_SUMMARY"
